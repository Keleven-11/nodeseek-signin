# .github/workflows/signin.yml
name: NodeSeek 每日签到

on:
  schedule:
    # 每天 23:00 UTC = 北京时间次日 07:00
    - cron: '0 23 * * *'
  workflow_dispatch:  # 允许手动触发（用于测试；手动触发跳过随机延迟，立即签到）

jobs:
  signin:
    runs-on: ubuntu-latest
    steps:
      - name: 随机整点延迟（北京时间 7:00–21:00）
        if: github.event_name == 'schedule'
        run: |
          H=$((7 + RANDOM % 15))
          S=$((RANDOM % 50 + 5))
          DELAY=$(( (H - 7) * 3600 + S ))
          echo "计划北京时间 $H 点签到（延迟 ${DELAY} 秒）"
          sleep $DELAY

      - name: 安装 Python 依赖 (curl_cffi)
        run: pip install curl_cffi

      - name: 签到领鸡腿
        id: signin
        env:
          NS_COOKIE_RAW: ${{ secrets.NS_COOKIE }}
        run: |
          python3 - <<'PYEOF'
          import os
          import sys
          import json
          from curl_cffi import requests

          # 1. 处理 Cookie (兼容 Netscape 格式和普通字符串)
          raw_cookie = os.environ.get("NS_COOKIE_RAW", "")
          if "\t" in raw_cookie:
              cookie_parts = []
              for line in raw_cookie.splitlines():
                  if line.startswith("#") or not line.strip():
                      continue
                  parts = line.split("\t")
                  if len(parts) >= 7:
                      cookie_parts.append(f"{parts[5]}={parts[6]}")
              cookie = "; ".join(cookie_parts)
          else:
              cookie = raw_cookie

          url = "https://www.nodeseek.com/api/attendance?random=true"
          headers = {
              "Cookie": cookie,
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36",
              "Referer": "https://www.nodeseek.com/",
              "Origin": "https://www.nodeseek.com",
              "Accept": "application/json"
          }

          # 2. 发送请求 (使用 curl_cffi 模拟 Chrome 浏览器)
          try:
              # impersonate="chrome120" 是绕过 Cloudflare 的关键
              r = requests.post(url, headers=headers, json={}, impersonate="chrome120", timeout=30)
              body = r.text
              http_code = r.status_code
          except Exception as e:
              body = ""
              http_code = 0
              print(f"请求异常: {e}")

          print(f"HTTP {http_code}")
          print(f"Response: {body[:500]}")

          # 3. 解析返回结果
          result = "failed"
          detail = ""
          gain = ""
          current = ""
          api_message = ""

          try:
              d = json.loads(body)
              gain = d.get("gain", "")
              current = d.get("current", "")
              api_message = str(d.get("message", "")).replace("\n", " ")
          except:
              pass

          # 4. 结果分类
          if '"success":true' in body.replace(" ", ""):
              result = "success"
          elif http_code in [401, 403]:
              result = "expired"
              detail = f"接口返回 HTTP {http_code}"
          elif any(kw in body.lower() for kw in ["未登录", "请先登录", "请登录", "登录已过期", "登录失效", "need login", "not logged", "unauthorized", "session"]):
              result = "expired"
              detail = "接口提示需要重新登录"
          elif "just a moment" in body.lower() or "challenge-platform" in body.lower():
              result = "failed"
              detail = "触发 Cloudflare 验证 (curl_cffi 仍被拦截，建议搭配代理)"
          elif not body:
              result = "failed"
              detail = "接口无返回（网络超时或连接失败）"
          else:
              result = "failed"
              detail = f"未知返回：{body[:200]}"

          # 5. 输出到 GITHUB_OUTPUT
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"gain={gain}\n")
              f.write(f"current={current}\n")
              f.write(f"api_message={api_message}\n")
              f.write(f"result={result}\n")
              f.write(f"detail={detail}\n")

          if result == "success":
              print("签到成功")
          else:
              print(f"签到失败 [{result}] {detail}")
              sys.exit(1)
          PYEOF

      - name: WxPusher 签到成功通知
        if: steps.signin.outputs.result == 'success'
        env:
          WXPUSHER_URL: ${{ secrets.WXPUSHER_URL }}
          SIGNIN_GAIN: ${{ steps.signin.outputs.gain }}
          SIGNIN_CURRENT: ${{ steps.signin.outputs.current }}
          SIGNIN_MESSAGE: ${{ steps.signin.outputs.api_message }}
        run: |
          python3 - <<'PYEOF'
          import os, urllib.parse, urllib.request, datetime
          base = os.environ.get("WXPUSHER_URL", "")
          if not base:
              print("未配置 WXPUSHER_URL secret，跳过微信推送")
              raise SystemExit(0)
          gain = os.environ.get("SIGNIN_GAIN") or "?"
          current = os.environ.get("SIGNIN_CURRENT") or "?"
          msg = os.environ.get("SIGNIN_MESSAGE") or ""
          now = (datetime.datetime.now(datetime.timezone.utc) + datetime.timedelta(hours=8)).strftime("%Y-%m-%d %H:%M")
          title = "NodeSeek 签到成功"
          content = "签到时间：%s（北京时间）\n本次获得：%s 个鸡腿\n当前共有：%s 个鸡腿" % (now, gain, current)
          if msg:
              content += "\n%s" % msg
          url = base + "?" + urllib.parse.urlencode({"title": title, "content": content})
          for i in range(3):
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                  with urllib.request.urlopen(req, timeout=25) as r:
                      print("WxPusher 推送成功，HTTP", r.status)
                  break
              except Exception as e:
                  print("推送第 %d 次失败：%s" % (i + 1, e))
          PYEOF

      - name: WxPusher 失败告警
        if: failure()
        env:
          WXPUSHER_URL: ${{ secrets.WXPUSHER_URL }}
          SIGNIN_RESULT: ${{ steps.signin.outputs.result }}
          SIGNIN_DETAIL: ${{ steps.signin.outputs.detail }}
        run: |
          python3 - <<'PYEOF'
          import os, urllib.parse, urllib.request
          base = os.environ.get("WXPUSHER_URL", "")
          if not base:
              print("未配置 WXPUSHER_URL secret，跳过微信推送")
              raise SystemExit(0)
          result = os.environ.get("SIGNIN_RESULT") or "failed"
          detail = os.environ.get("SIGNIN_DETAIL") or "步骤异常中断，请查看 Actions 日志"
          if result == "expired":
              title = "NodeSeek 签到失败：Cookie 已过期"
              content = ("原因：登录态失效（%s）。\n请重新导出浏览器 cookie，更新仓库 Secrets 中的 NS_COOKIE，然后手动重跑一次 workflow。" % detail)
          else:
              title = "NodeSeek 签到失败"
              content = ("原因：%s。\n请到 GitHub Actions 查看本次运行日志排查，必要时手动重跑一次。" % detail)
          url = base + "?" + urllib.parse.urlencode({"title": title, "content": content})
          ok = False
          for i in range(3):
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                  with urllib.request.urlopen(req, timeout=25) as r:
                      print("WxPusher 推送成功，HTTP", r.status)
                  ok = True
                  break
              except Exception as e:
                  print("推送第 %d 次失败：%s" % (i + 1, e))
          if not ok:
              print("WxPusher 推送失败（已重试 3 次）")
          PYEOF
